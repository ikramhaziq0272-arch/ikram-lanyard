<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>IKRAM HAZIQ - Interactive Lanyard</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <div
    class="scene"
    id="scene"
  >

    <!-- Titik gantungan -->
    <div class="top-point left"></div>
    <div class="top-point right"></div>

    <!-- Tali kiri -->
    <div
      class="strap"
      id="strapLeft"
    ></div>

    <!-- Tali kanan -->
    <div
      class="strap"
      id="strapRight"
    ></div>


    <!-- Kad -->
    <div
      class="holder"
      id="holder"
    >

      <div class="connector">

        <div class="ring"></div>

        <div class="clip">
          <div class="clip-highlight"></div>
        </div>

      </div>


      <div class="card">

        <div class="card-glow"></div>

        <div class="avatar">
          <img
            src="./Gambar diri.jpg"
            alt="Ikram Haziq"
          >
        </div>

        <h2>
          IKRAM HAZIQ
        </h2>

        <div class="divider"></div>

        <p class="subject">
          Bahasa Melayu
        </p>

        <p class="hint">
          Tekan, tahan dan tarik
        </p>

      </div>

    </div>

  </div>


  <script
    src="./script.js"
    defer
  ></script>

</body>

</html>
