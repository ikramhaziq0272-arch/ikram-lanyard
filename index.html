<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>IKRAM HAZIQ - Interactive Lanyard</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <div class="scene" id="scene">

    <!-- Titik atas lanyard -->
    <div class="top-point left"></div>
    <div class="top-point right"></div>

    <!-- Dua tali -->
    <div
      class="strap"
      id="strapLeft"
    ></div>

    <div
      class="strap"
      id="strapRight"
    ></div>


    <!-- Seluruh kad yang boleh ditarik -->
    <div
      class="holder"
      id="holder"
    >

      <!-- Penyambung -->
      <div class="connector">

        <div class="ring"></div>

        <div class="clip">
          <div class="clip-line"></div>
        </div>

      </div>


      <!-- Kad -->
      <div class="card">

        <div class="hole"></div>

        <div class="avatar">
  <img src="./Gambar diri.jpg" alt="Ikram Haziq">
</div>

        <h2>
          IKRAM HAZIQ
        </h2>

        <div class="divider"></div>

        <p class="subject">
          Bahasa Melayu
        </p>

        <p class="hint">
          Tekan, tahan dan tarik
        </p>

      </div>

    </div>

  </div>

  <script
    src="./script.js"
    defer
  ></script>

</body>

</html>
