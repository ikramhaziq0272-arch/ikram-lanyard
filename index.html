<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>IKRAM HAZIQ - Interactive Lanyard</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <div
    class="scene"
    id="scene"
  >

    <div
      class="holder"
      id="holder"
    >

      <!-- GAMBAR LANYARD SEBENAR -->
      <img
        src="./Gambar_Lanyard_Ikram-removebg-preview.png"
        alt="Lanyard Ikram"
        class="lanyard-img"
      >


      <!-- KAD -->
      <div class="card">


        <!-- GAMBAR PROFIL -->
        <div class="avatar">

          <img
            src="./Gambar diri.jpg"
            alt="Ikram Haziq"
          >

        </div>


        <!-- NAMA -->
        <h2>
          IKRAM HAZIQ
        </h2>


        <!-- GARIS -->
        <div class="divider"></div>


        <!-- SUBJEK -->
        <p class="subject">
          Bahasa Melayu
        </p>


        <!-- ARAHAN -->
        <p class="hint">
          Tekan, tahan dan tarik
        </p>


      </div>

    </div>

  </div>


  <script
    src="./script.js"
    defer
  ></script>

</body>

</html>
